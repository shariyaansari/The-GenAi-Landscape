name: Daily AI Tool Scrape

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Scraper Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PRODUCT_HUNT_API_TOKEN: ${{ secrets.PRODUCT_HUNT_API_TOKEN }}
        run: python backend/run_pipeline.py